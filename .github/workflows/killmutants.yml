# A second opinion beside the nightly Stryker sweep, from a different engine.
#
# KillMutants compiles one assembly per mutant and launches the xUnit 4 test executable itself,
# where Stryker injects every mutant into a single compilation and drives the platform. Different
# mutator families, different selection, different test host: two tools that disagree about a
# survivor are saying something, and one tool agreeing with itself is not. It also answers the
# question Stryker cannot here - whether a kill reproduces - with --verify-kills.
#
# The tool is 0.1.0-alpha and is not on NuGet, so the job builds it from the pinned commit below.
# That pin is the one this repository has actually run; move it deliberately, not automatically.
name: killmutants

on:
  schedule:
    # 04:07 UTC, clear of the Stryker nightly at 03:17: two sweeps on the same runner-sized box
    # would turn each other's slow mutants into timeouts.
    - cron: '7 4 * * *'
  # On a pull request it judges the change rather than the repository - and fails when the diff
  # carries a mutant nothing detects. That is the gate; drop `--since` below and it becomes a
  # report. It takes seconds when the change touches production code only, and as long as the
  # nightly when it touches an existing test file, which widens the run to every project that test
  # exercises.
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: killmutants-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # Reefact/kill-mutants, pinned by commit. Moved from 9fd45e9 for --stop-after and the verdict
  # log, which kill-mutants built because this job lost its nightly run to the timeout three nights
  # out of four and kept nothing of it (Reefact/kill-mutants#24).
  KILLMUTANTS_REF: '23b0be5d2175b695c6d334c714452f62a7de3404'
  # How long the tool tests before it stops and writes the report of what it judged. It has to stop
  # itself: when the job's timeout-minutes runs out, GitHub signals the step's shell rather than the
  # tool and kills the tree seconds later, so a run that outlasts the job is lost whole. Five
  # minutes under the job's 90, which is all it needs: the steps before Mutate take about 25
  # seconds, and from the deadline to the report the tool takes well under one.
  KILLMUTANTS_STOP_AFTER: '85m'

jobs:
  mutate:
    name: Mutation test (KillMutants)
    runs-on: ubuntu-latest
    # One compilation per mutant is the slow, honest way round; a hosted runner has fewer cores
    # than the machine this was measured on.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # --since resolves a merge base, which needs the history either side of it.
          fetch-depth: 0

      - name: Checkout KillMutants
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Reefact/kill-mutants
          ref: ${{ env.KILLMUTANTS_REF }}
          path: .killmutants-src

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Packed and installed outside the workspace, then the sources are removed: the tool scans
      # the directory it is pointed at for test projects, and it would otherwise find its own.
      - name: Build the tool
        run: |
          set -euo pipefail
          dotnet pack .killmutants-src/src/KillMutants.Cli -c Release -o "$RUNNER_TEMP/km-pkg"
          dotnet tool install KillMutants \
            --tool-path "$RUNNER_TEMP/km-tool" \
            --add-source "$RUNNER_TEMP/km-pkg" \
            --prerelease
          rm -rf .killmutants-src

      # A home of its own, for the same reason the Stryker nightly takes one: a mutant that drops
      # the `directoryPath ?? DefaultDirectoryPath` seam writes to ~/.slugger and ~/.config for
      # real, whatever directory the test handed it.
      # The base SHA rather than origin/<branch>: checkout fetched the history, not necessarily a
      # remote-tracking branch to name it by. Read through the environment rather than
      # interpolated into the script, as everything from the event is.
      - name: Mutate
        id: mutate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          export DOTNET_CLI_HOME="$HOME" NUGET_PACKAGES="${NUGET_PACKAGES:-$HOME/.nuget/packages}"
          export HOME="$RUNNER_TEMP/mutation-home"
          mkdir -p "$HOME"
          # A run stopped by the deadline reports what it judged and prints no score. On a pull
          # request that is a red gate, since a change half judged has not been shown to pass; at
          # night, with no gate asked for, it is green and says so in the summary below.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            "$RUNNER_TEMP/km-tool/killmutants" . \
              --exclude "tests/Slugger.ArchitectureTests/*" \
              --since "$BASE_SHA" \
              --stop-after "$KILLMUTANTS_STOP_AFTER" \
              --report-json killmutants-report.json
          else
            # Ten kills re-tested on their own: a verdict that does not survive its own repetition
            # was never a measurement, which is exactly the doubt the Stryker wobble left here.
            # The architecture rules are left out: they read the assembly's shape rather than run
            # its code, so they kill nothing and cost a run per mutant. Excluded, not excused -
            # dotnet test still runs them on every push.
            "$RUNNER_TEMP/km-tool/killmutants" . \
              --exclude "tests/Slugger.ArchitectureTests/*" \
              --verify-kills 10 \
              --stop-after "$KILLMUTANTS_STOP_AFTER" \
              --report-json killmutants-report.json
          fi

      # The console output scrolls past; this is what gets read.
      #
      # From the report when there is one. Without it, from the verdict log the tool writes beside
      # it, one mutant per line as each verdict is final: that is what is left of a run killed
      # before it could write its report - a job cancelled by a newer push, or one the timeout
      # overtook. An always() step is still evaluated when the job is cancelled; on the last run the
      # timeout killed, this one was, and was skipped for want of a file.
      - name: Summarise
        if: always() && (hashFiles('killmutants-report.json') != '' || hashFiles('killmutants-report.jsonl') != '')
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections
          import json
          import os

          # Every field is read with a default: a summary that fails the run because the report
          # gained or lost a key is worse than no summary, and this tool is 0.1.0-alpha.
          def field(source, key):
              return source.get(key, "-")

          if not os.path.exists("killmutants-report.json"):
              verdicts = [
                  json.loads(line)
                  for line in open("killmutants-report.jsonl", encoding="utf-8")
                  if line.strip()
              ]
              statuses = collections.Counter(verdict.get("status", "-") for verdict in verdicts)

              print("## KillMutants: no report - the run was killed before it could write one")
              print()
              print(f"{len(verdicts)} verdict(s) had landed in the log. It does not say how many "
                    "mutants were selected, so these are what was judged, not a share of anything.")
              print()
              print("| status | mutants |")
              print("| --- | --- |")
              for status, count in sorted(statuses.items()):
                  print(f"| {status} | {count} |")
              raise SystemExit(0)

          report = json.load(open("killmutants-report.json", encoding="utf-8"))
          totals = report.get("totals", {})
          environment = report.get("environment", {})

          # A stopped run and a pull request's run have no score, by design, and the headline used
          # to print the null it is published as. Each says instead what it does have.
          if report.get("complete", True) is False:
              selected = report.get("mutantsSelected")
              of = "" if selected is None else f" of {selected}"
              print(f"## KillMutants: stopped at the deadline - {field(totals, 'mutants')}{of} "
                    "mutants judged, no score")
          elif field(report.get("scope", {}), "mode") == "partial":
              print(f"## KillMutants: {field(totals, 'undetected')} undetected mutant(s) in the change")
              # The three reasons a partial run withholds its verdict whatever it counted; the job
              # log names which.
              if report.get("comparisonIsIncomplete") or report.get("coverageLost") or report.get("inconclusive"):
                  print()
                  print("The run withheld its verdict; the job log says why.")
          else:
              print("## KillMutants: " + str(field(report, "scoreDisplay")))
          print()
          print("| | |")
          print("| --- | --- |")
          for key in ("mutants", "killed", "survived", "timedOut", "noCoverage", "compileErrors"):
              print(f"| {key} | {field(totals, key)} |")
          print(f"| workers | {field(environment, 'workerCount')} of {field(environment, 'processorCount')} |")
          print(f"| kills re-verified | {field(environment, 'killsReVerifiedAlone')} |")
          print()

          # The per-family table is the part worth reading: a family detected at 30% and one at
          # 90% are two different findings, and the average of them is neither.
          families = report.get("byMutator", [])
          if families:
              print("| mutator | mutants | detected | undetected |")
              print("| --- | --- | --- | --- |")
              for family in families:
                  print(
                      f"| {field(family, 'mutator')} | {field(family, 'mutants')} "
                      f"| {field(family, 'detected')} | {field(family, 'undetected')} |"
                  )
              print()

          warnings = report.get("warnings", [])
          if warnings:
              print("### Warnings")
              print()
              for warning in warnings:
                  print(f"- {warning}")
          PY

      # Kept because a score means something only next to the one before it, and the log expires
      # long before anyone asks when a number started dropping. The verdict log goes with it: for a
      # run that was killed it is the only record there is.
      - name: Upload the report
        if: always() && (hashFiles('killmutants-report.json') != '' || hashFiles('killmutants-report.jsonl') != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: killmutants-report-${{ github.run_id }}
          path: |
            killmutants-report.json
            killmutants-report.jsonl
          retention-days: 90
