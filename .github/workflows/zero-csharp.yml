# Builds the Zero C# experiment and reports how small it came out. The experiment lives on its own
# branch and never goes through a pull request, so this runs on a push to that branch. It is outside
# slugger.slnx: ci.yml and release.yml never read it.
name: zero-csharp

on:
  push:
    branches:
      - experiment/zero-csharp
  workflow_dispatch:

concurrency:
  group: zero-csharp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: Build zeroslugger (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: The generated words are up to date
        run: |
          set -euo pipefail
          sh experiments/zero-csharp/generate-words.sh
          git diff --exit-code -- experiments/zero-csharp/DockerWords.g.cs

      - name: Build
        working-directory: experiments/zero-csharp
        run: dotnet build -c Release

      - name: Integration tests, then report its size
        shell: bash
        run: |
          set -euo pipefail
          binary=$(find experiments/zero-csharp/bin/Release -name ZeroSlugger -type f | head -1)
          test -n "$binary"
          sh experiments/zero-csharp/integration-tests.sh "$binary"
          size=$(stat -c %s "$binary")
          echo "zeroslugger (linux-x64): $size bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "zeroslugger (linux-x64): $size bytes"
