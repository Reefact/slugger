<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
  <!--
    icon.svg's glove for 16 to 32 pixels, where grooves, highlights and stitches only blur the
    shape: no inner detail, a thicker outline, a larger glove and a larger, whiter ball with two
    plain seams. Side by side at 16 px, the full drawing is a brown blot with a pink dot.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22466f"/>
      <stop offset="1" stop-color="#11263f"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6a35e"/>
      <stop offset="1" stop-color="#b3652c"/>
    </linearGradient>
    <path id="glove" d="M92 70 C90 42 122 36 124 60 C124 32 160 28 160 56 C163 36 196 40 192 68
                        C198 52 226 60 220 92 C218 128 222 160 210 188 C196 220 166 236 128 236
                        C90 236 56 222 42 194 C28 170 16 126 20 98 C24 70 52 62 54 90
                        C58 118 74 146 92 162 C90 130 92 100 92 70 Z"/>
    <clipPath id="ball-clip">
      <circle r="44"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#tile)"/>

  <g transform="translate(128 128) rotate(-12) scale(1) translate(-120 -136)">
    <g stroke="#3f1f08" stroke-width="14" stroke-linecap="round">
      <path d="M50 92 L92 86"/>
      <path d="M57 124 L91 122"/>
    </g>

    <use xlink:href="#glove" fill="url(#leather)" stroke="#3f1f08" stroke-width="16" stroke-linejoin="round"/>

    <g transform="translate(130 160)">
      <circle r="48" fill="#ffffff" stroke="#3f1f08" stroke-width="9"/>
      <g clip-path="url(#ball-clip)" fill="none" stroke="#d62828" stroke-width="10">
        <circle cx="-80" r="58"/>
        <circle cx="80" r="58"/>
      </g>
    </g>
  </g>
</svg>
